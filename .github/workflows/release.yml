name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check tag matches package versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          for package in runtime adapter mcp; do
            actual=$(node -p "require('./packages/$package/package.json').version")
            if [ "$actual" != "$version" ]; then
              echo "packages/$package is $actual, tag is $GITHUB_REF_NAME" >&2
              exit 1
            fi
          done

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

      - name: Pack
        run: |
          mkdir release
          npm pack ./dist/npm/runtime ./dist/npm/adapter ./dist/npm/mcp --pack-destination release
          cd release && sha256sum *.tgz > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes
